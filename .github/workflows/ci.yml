name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: arc_owner
          POSTGRES_PASSWORD: arc_owner_dev
          POSTGRES_DB: arc_tid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arc_owner -d arc_tid" --health-interval 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PGPASSWORD: arc_owner_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "AUTH_RATE_LIMIT=100" >> .env
          psql -h localhost -U arc_owner -d arc_tid -f packages/db/init/01-roles.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations
        run: pnpm db:migrate
      - name: Migrations are in sync with the schema
        run: |
          pnpm --filter @arc-tid/db exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts has changes without a migration. Run 'pnpm --filter @arc-tid/db generate'."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - run: pnpm db:seed
      - name: Browser for PDF rendering and E2E
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @arc-tid/web build
      - name: E2E
        run: |
          pnpm --filter @arc-tid/api start &
          pnpm --filter @arc-tid/web start &
          npx --yes wait-on http://localhost:4000/health http://localhost:3000/login
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
